name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: niches
          POSTGRES_USER: niches
          POSTGRES_PASSWORD: niches
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niches -d niches"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # the badge step compares this commit with the current main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt coverage

      - name: Run smoke tests with coverage
        working-directory: backend
        run: |
          coverage run --source=. --omit="tests/*" tests/test_smoke.py
          coverage run -a --source=. --omit="tests/*" tests/test_mcp_tools.py
          coverage run -a --source=. --omit="tests/*" tests/test_http_rate_limit.py
          coverage run -a --source=. --omit="tests/*" tests/test_http_api.py
          # sqlite doubles and pure domain code: no Postgres, no network
          for t in test_inspection test_metadata_review test_alerts test_alerts_domain \
                   test_library test_rss test_top_tags test_keywords_domain test_metadata_domain \
                   test_tagging test_tag_stats_domain test_export test_ideas \
                   test_idea_verdicts_domain; do
            coverage run -a --source=. --omit="tests/*" "tests/$t.py"
          done
          coverage report -m
          coverage json -o /tmp/coverage_full.json
          python3 -c "
          import json
          d = json.load(open('/tmp/coverage_full.json'))
          json.dump({'totals': d['totals']}, open('../assets/coverage.json', 'w'), indent=2)
          "

      - name: Commit coverage badge data
        if: github.event_name == 'push'
        # Several merges in a row start several runs at once. Only the run for
        # the newest human commit on main may write the badge: an older run
        # would overwrite it with stale coverage, and its rebase conflicts on
        # the same file (this happened merging PRs #8-#12). -X theirs keeps
        # this run's numbers if it still races with another bot commit.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/coverage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git fetch origin main
          if git log --format=%an "$GITHUB_SHA..origin/main" | grep -qv 'github-actions\[bot\]'; then
            echo "main has newer commits; their run updates the badge"
            exit 0
          fi
          git commit -m "Update coverage badge data [skip ci]"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web/worker images
        run: docker compose build
